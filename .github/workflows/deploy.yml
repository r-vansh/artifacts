name: Deploy

# Builds the site and publishes dist/ to GitHub Pages. Runs only when started by
# hand (Actions → Deploy → Run workflow), so work in progress never goes live.
# One-time setup: Settings → Pages → Source: GitHub Actions, and the custom
# domain artifacts.vanshrastogi.me (a CNAME at Namecheap to r-vansh.github.io).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
